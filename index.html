<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>我的随身问答</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d23;--line:#2a2f38;--txt:#e6e8eb;--sub:#8b929e;--acc:#057748;--user:#1f3a2e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:16px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
  #wrap{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--card);
    border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top));flex:0 0 auto}
  header b{font-size:16px}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--acc)}
  header select,header button{margin-left:auto;background:#23272f;color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:6px 10px;font-size:14px}
  header button{margin-left:6px}
  #log{flex:1;overflow-y:auto;padding:14px 14px 8px;-webkit-overflow-scrolling:touch}
  .msg{margin:0 0 14px;display:flex}
  .msg .bubble{max-width:92%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-break:break-word}
  .me{justify-content:flex-end}.me .bubble{background:var(--user);border-bottom-right-radius:4px}
  .ai .bubble{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
  .ai.thinking .bubble{color:var(--sub)}
  #bar{display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line);
    padding-bottom:calc(10px + env(safe-area-inset-bottom));flex:0 0 auto}
  #q{flex:1;resize:none;max-height:120px;min-height:44px;background:#23272f;color:var(--txt);
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:16px/1.5 inherit}
  #send{width:64px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;font-weight:600}
  #send:disabled{opacity:.45}
  #hint{font-size:12px;color:var(--sub);text-align:center;padding:0 14px 6px;background:var(--card);flex:0 0 auto}
  .err{color:#ff8a80}
  #setup{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;
    justify-content:center;padding:28px}
  #setup h1{font-size:20px;margin:0 0 6px}
  #setup p{color:var(--sub);font-size:14px;margin:0 0 18px;line-height:1.6}
  #setup input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);
    background:#23272f;color:var(--txt);font-size:16px}
  #setup button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:12px;
    background:var(--acc);color:#fff;font-size:16px;font-weight:600}
  #setup small{display:block;margin-top:14px;color:var(--sub);font-size:12px;line-height:1.6}
  .hide{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="dot"></span><b>随身问答</b>
    <select id="model">
      <option value="deepseek-chat">chat</option>
      <option value="deepseek-reasoner">reasoner</option>
    </select>
    <button id="clear">清空</button>
  </header>
  <div id="log"></div>
  <div id="hint">Enter 发送 · Shift+Enter 换行</div>
  <div id="bar">
    <textarea id="q" rows="1" placeholder="问点什么…"></textarea>
    <button id="send">发送</button>
  </div>
</div>

<div id="setup">
  <h1>先填 API Key</h1>
  <p>只需填一次，存在这台手机的浏览器里，不会上传到任何服务器。</p>
  <input id="keyin" type="password" placeholder="sk-..." autocomplete="off">
  <button id="save">保存并开始</button>
  <small>Key 在 platform.deepseek.com 生成。填完这页就消失，以后不再问。想换 key：长按页面标题或清空浏览器数据。</small>
</div>

<script>
const API="https://api.deepseek.com/chat/completions";
const K_KEY="ds_apikey_v1", K_HIS="ds_hist_v1";
const log=document.getElementById('log'), q=document.getElementById('q');
const send=document.getElementById('send'), model=document.getElementById('model');
const setup=document.getElementById('setup');
let history=[], busy=false;

function getKey(){ return localStorage.getItem(K_KEY)||''; }
function needSetup(){ setup.classList.toggle('hide', !!getKey()); }

function bubble(role,text){
  const d=document.createElement('div'); d.className='msg '+(role==='user'?'me':'ai');
  const b=document.createElement('div'); b.className='bubble'; b.textContent=text||'';
  d.appendChild(b); log.appendChild(d); scrollBottom(); return b;
}
function scrollBottom(){ log.scrollTop=log.scrollHeight; }
function render(){ log.innerHTML=''; history.forEach(m=>bubble(m.role,m.content)); }
function saveHist(){ try{ localStorage.setItem(K_HIS, JSON.stringify(history.slice(-40))); }catch(e){} }

try{ history=JSON.parse(localStorage.getItem(K_HIS)||'[]'); }catch(e){ history=[]; }
needSetup(); render();

document.getElementById('save').onclick=()=>{
  const v=document.getElementById('keyin').value.trim();
  if(!v.startsWith('sk-')){ alert('看起来不像 sk- 开头的 key'); return; }
  localStorage.setItem(K_KEY,v); setup.classList.add('hide');
};
document.getElementById('keyin').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('save').click();
});
document.getElementById('clear').onclick=()=>{
  if(!confirm('清空当前对话？')) return;
  history=[]; saveHist(); render();
};

async function ask(){
  const text=q.value.trim();
  if(!text||busy) return;
  if(!getKey()){ needSetup(); return; }
  busy=true; send.disabled=true; q.value=''; q.style.height='auto';
  history.push({role:'user',content:text}); bubble('user',text);
  const holder=bubble('assistant','');
  holder.parentElement.classList.add('thinking');
  let acc='';
  try{
    const r=await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+getKey()},
      body:JSON.stringify({model:model.value,messages:history,stream:true,max_tokens:4096})
    });
    if(!r.ok){
      const t=await r.text();
      throw new Error('HTTP '+r.status+' '+t.slice(0,200));
    }
    const rd=r.body.getReader(), dec=new TextDecoder();
    let buf='';
    while(true){
      const {done,value}=await rd.read();
      if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n'))>=0){
        const line=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!line.startsWith('data:')) continue;
        const data=line.slice(5).trim();
        if(!data||data==='[DONE]') continue;
        try{
          const j=JSON.parse(data);
          const ch=j.choices&&j.choices[0]&&j.choices[0].delta;
          const c=ch&&(ch.content||ch.reasoning_content);
          if(c){ acc+=c; holder.textContent=acc; scrollBottom(); }
        }catch(e){}
      }
    }
    holder.parentElement.classList.remove('thinking');
    if(acc){ history.push({role:'assistant',content:acc}); }
    else{ holder.textContent='（没返回内容，检查 key 或额度）'; holder.classList.add('err'); }
    saveHist();
  }catch(e){
    holder.parentElement.classList.remove('thinking');
    holder.textContent='出错：'+e.message; holder.classList.add('err');
  }finally{ busy=false; send.disabled=false; }
}

send.onclick=ask;
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); ask(); }
});
q.addEventListener('input',()=>{ q.style.height='auto'; q.style.height=Math.min(q.scrollHeight,120)+'px'; });
</script>
</body>
</html>
